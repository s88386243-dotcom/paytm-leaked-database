services:
  - type: web
    name: sandesh-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python lookup_api.py
    envVars:
      - key: HF_TOKEN
        value: hf_xxxxxxx   # अपना Hugging Face token डालो

  - type: worker
    name: telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: BOT_TOKEN
        value: 123456:ABCDEF...   # अपना Telegram bot token डालो
      - key: API_URL
        value: https://sandesh-api.onrender.com/lookup?mobile=
